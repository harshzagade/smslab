name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile package
        run: python -m compileall -q smslab
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Load-test smoke check
        run: |
          smslab loadtest --config examples/config.example.json --volume 3 --concurrency 2 --report /tmp/smslab-load.json
          python -c "import json; report=json.load(open('/tmp/smslab-load.json', encoding='utf-8')); assert report['summary']['total'] == 3; assert report['summary']['failed'] == 0"

      - name: Mock-burst smoke check
        run: |
          smslab mock-burst --attempts 10 --limit 2 --window-seconds 60 --report /tmp/smslab-burst.json
          python -c "import json; report=json.load(open('/tmp/smslab-burst.json', encoding='utf-8')); assert report['summary']['attempted'] == 10; assert report['summary']['accepted_by_mock_limiter'] == 2; assert report['summary']['rejected_rate_limit'] == 8; assert report['actual_transmissions'] == 0; assert all(not item['sms_sent'] for item in report['results'])"
