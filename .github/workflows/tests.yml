name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile package
        run: python -m compileall -q smslab
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run mock-only CLI smoke test
        run: |
          smslab init --output /tmp/smslab-config.json
          smslab validate --config /tmp/smslab-config.json
          smslab run --config /tmp/smslab-config.json --report /tmp/smslab-report.json
          python -c "import json; r=json.load(open('/tmp/smslab-report.json', encoding='utf-8')); assert r['summary']['total'] > 0"
