[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smslab"
version = "2.1.0"
description = "Mock-only SMS/OTP scenario, burst rate-limit, and bounded load testing CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Harsh Zagade" }]
keywords = ["sms", "otp", "mock", "testing", "load-testing", "rate-limit", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
  "Topic :: Communications :: Telephony",
]
dependencies = []

[project.scripts]
smslab = "smslab.cli:main"

[project.urls]
Homepage = "https://github.com/harshzagade/smslab"
Repository = "https://github.com/harshzagade/smslab"
Issues = "https://github.com/harshzagade/smslab/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["smslab*"]
