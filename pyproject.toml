[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smslab"
version = "1.0.0"
description = "Mock-first SMS/OTP integration testing CLI for developers — no real SMS is ever sent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Harsh Zagade" }
]
keywords = ["sms", "otp", "testing", "mock", "cli", "integration-testing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Communications :: Telephony",
]
dependencies = []

[project.scripts]
smslab = "smslab.cli:main"

[project.urls]
Repository = "https://github.com/example/smslab"

[tool.setuptools.packages.find]
where = ["."]
include = ["smslab*"]
